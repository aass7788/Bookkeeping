services:
  app:
    image: ghcr.io/aass7788/bookkeeping:latest
    container_name: jizhang
    volumes:
      - jizhang_data:/app/data
    environment:
      - JIZHANG_TOKEN=${JIZHANG_TOKEN}
      - JIZHANG_ADMIN_PW=${JIZHANG_ADMIN_PW}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:alpine
    container_name: jizhang-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  jizhang_data:
